<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Управление рестораном</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 30px;
                background: #f5f7f5;
                color: #183328;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
            }

            main {
                max-width: 1100px;
                margin: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background: white;
            }

            th,
            td {
                text-align: left;
                padding: 12px;
                border-bottom: 1px solid #e1e8e2;
            }

            th {
                background: #e8f1ea;
            }

            button {
                padding: 10px 16px;
                cursor: pointer;
            }

            .available {
                color: #187c49;
            }

            .unavailable {
                color: #a83b3b;
            }

            .table-wrap {
                overflow-x: auto;
            }
        </style>
    </head>

    <body>
        <main>
            <header>
                <h1>Панель ресторана</h1>
                <form method="post" action="{{ url_for('admin.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit">Выйти</button>
                </form>
            </header>

            <p>Меню</p>
            <section class="rules-section">
                <h2>Настройки рекомендаций</h2>

                <form method="post" action="{{ url_for('admin.change_restaurant_rules') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <label for="preference-weight">Вес предпочтений (0–5)</label>
                    <input id="preference-weight" type="number" name="preference_weight"
                        value="{{ rules.preference_weight }}" min="0" max="5" required>

                    <label for="pairing-weight">Вес сочетаний (0–5)</label>
                    <input id="pairing-weight" type="number" name="pairing_weight"
                        value="{{ rules.pairing_weight }}" min="0" max="5" required>

                    <label for="category-weight">Вес этапа заказа (0–5)</label>
                    <input id="category-weight" type="number" name="category_weight"
                        value="{{ rules.category_weight }}" min="0" max="5" required>

                    <label>
                        <input type="checkbox" name="enabled" value="1" {% if rules.enabled
                            %}checked{% endif %}>
                        Рекомендации включены
                    </label>

                    <button type="submit">Сохранить настройки</button>
                </form>
            </section>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Блюдо</th>
                            <th>Категория</th>
                            <th>Цена</th>
                            <th>Наличие</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for dish in dishes %}
                        <tr>
                            <td>{{ dish.id }}</td>
                            <td>{{ dish.name }}</td>
                            <td>{{ dish.category }}</td>
                            <td>
                                <form method="post"
                                    action="{{ url_for('admin.change_dish_price', dish_id=dish.id) }}">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                                    <input type="number" name="price_kopeck"
                                        value="{{ dish.price_kopeck }}" min="1" max="100000000"
                                        step="1" required
                                        aria-label="Цена в копейках для {{ dish.name }}">

                                    <button type="submit">Сохранить</button>
                                </form>
                            </td>
                            <td>
                                {% if dish.available %}
                                <span class="available">В наличии</span>
                                {% else %}
                                <span class="unavailable">Нет в наличии</span>
                                {% endif %}

                                <form method="post"
                                    action="{{ url_for('admin.change_dish_availability', dish_id=dish.id) }}">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                                    {% if dish.available %}
                                    <input type="hidden" name="available" value="0">
                                    <button type="submit">Снять с продажи</button>
                                    {% else %}
                                    <input type="hidden" name="available" value="1">
                                    <button type="submit">Вернуть в продажу</button>
                                    {% endif %}
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </main>
    </body>

</html>
